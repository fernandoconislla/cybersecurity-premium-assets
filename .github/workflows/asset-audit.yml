name: Premium SVG workflow audit

on:
  push:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'skills/cybersecurity-premium-assets/**'
      - '.github/workflows/asset-audit.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'skills/cybersecurity-premium-assets/**'
      - '.github/workflows/asset-audit.yml'
  workflow_dispatch:

jobs:
  verify-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip cairosvg Pillow
      - name: Compile Python sources
        run: python -m py_compile scripts/validate_asset.py scripts/audit_workflow.py scripts/approval_gate.py scripts/master_cache.py scripts/bootstrap_audit.py scripts/build_master_pack.py scripts/build_audit_runtime_bundle.py tests/test_audit_workflow.py tests/test_bootstrap_audit.py tests/test_master_cache.py
      - name: Verify approved master pack (17 exact Git blobs)
        run: python scripts/build_master_pack.py --check
      - name: Verify full offline audit runtime bundle
        run: python scripts/build_audit_runtime_bundle.py --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
