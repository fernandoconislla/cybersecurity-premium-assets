<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="server-title server-desc">
  <title id="server-title">Servidor — candidato de familia premium</title>
  <desc id="server-desc">Servidor físico de tres módulos frontales, contorno doble y superficies divididas en cian y azul marino. Icono vectorial editable.</desc>
  <style>
    :root {
      --PRIMARY: #092B60;
      --SECONDARY: #38BDF8;
      --CONTRAST: #FFFFFF;
    }
    .primary { fill: var(--PRIMARY); }
    .secondary { fill: var(--SECONDARY); }
    .contrast { fill: var(--CONTRAST); }
  </style>
  <defs>
    <path id="server-silhouette" d="M234 51 H790 C842 51 873 87 873 139 V885 C873 937 842 973 790 973 H234 C182 973 151 937 151 885 V139 C151 87 182 51 234 51 Z"/>
