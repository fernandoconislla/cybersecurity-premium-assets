    <path id="server-face" d="M234 105 H790 C805 105 819 119 819 139 V885 C819 905 805 919 790 919 H234 C219 919 205 905 205 885 V139 C205 119 219 105 234 105 Z"/>
    <clipPath id="server-face-clip"><use href="#server-face"/></clipPath>
  </defs>

  <g id="main-chassis" aria-label="Chasis frontal con doble contorno">
    <use href="#server-silhouette" class="primary" id="outer-edge"/>
    <use href="#server-white-inset" class="contrast" id="inner-white-edge"/>
    <use href="#server-face" class="secondary" id="chassis-face"/>
    <g clip-path="url(#server-face-clip)" id="chassis-navy-half">
      <path d="M512 0 H1024 V1024 H512 Z" class="primary"/>
    </g>
  </g>

