    <path id="bezel-white" class="contrast" d="M194 163 H830 C841 163 849 171 849 182 V703 H175 V182 C175 171 183 163 194 163 Z"/>
    <path id="display-cyan" class="secondary" d="M206 192 H818 V671 H206 Z"/>
    <path id="inner-bottom-lip" class="primary" d="M458 693 H566 Q574 693 574 702 V717 H450 V702 Q450 693 458 693 Z"/>
  </g>
