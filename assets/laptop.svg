<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="asset-title asset-desc">
  <title id="asset-title">Laptop — Familia premium V1</title>
  <desc id="asset-desc">Ordenador portátil frontal abierto con pantalla celeste, bisel azul marino y blanco y base con teclado minimalista; SVG vectorial editable.</desc>
  <style>
    :root {
      --PRIMARY: #092B60;
      --SECONDARY: #38BDF8;
      --CONTRAST: #FFFFFF;
    }
    .primary { fill: var(--PRIMARY); }
    .secondary { fill: var(--SECONDARY); }
    .contrast { fill: var(--CONTRAST); }
  </style>
  <g id="screen-frame" aria-label="Pantalla y biseles de ordenador portátil">
