    <path id="torso-white-divider" class="contrast" d="M130 929 C130 724 274 556 463 556 H561 C750 556 894 724 894 929 V939 C894 943 891 945 887 945 H137 C133 945 130 943 130 939 Z"/>
    <path id="torso-cyan-field" class="secondary" d="M158 928 C158 739 290 582 464 582 H560 C734 582 866 739 866 928 V918 H158 Z"/>
