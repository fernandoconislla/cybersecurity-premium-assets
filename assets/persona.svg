<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="asset-title asset-description">
  <title id="asset-title">Persona — avatar tecnológico premium V3</title>
